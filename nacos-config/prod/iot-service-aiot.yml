server:
  port: 8185

spring:
  datasource:
    url: jdbc:mysql://192.168.1.15:3306/iot_aiot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 15000
  redis:
    host: 192.168.1.21
    port: 6381
    password: 5411a124b0dee3b08bde02ae3142d289
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${spring.application.name}-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

iot:
  security:
    jwt:
      secret: iot-platform-jwt-hs256-secret-key-change-me-in-production-env
      validate-bearer: true
  middleware:
    redis:
      enabled: true
    kafka:
      enabled: true
  gateway-trust:
    enabled: true
    secret: iot-platform-gateway-shared-secret
    permit-paths:
      - /ping
      - /actuator/health
      - /actuator/info
      - /error
  clickhouse:
    enabled: true
    url: jdbc:ch:http://192.168.1.250:8123/default
    username: admin
    password: Admin@2024
  aiot:
    default-provider: QWEN
    auto-execute-query: true
    max-rows: 200
    providers:
      qwen:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ""
        model: qwen2.5-7b-instruct
      deepseek:
        base-url: https://api.deepseek.com/v1
        api-key: ""
        model: deepseek-chat

management:
  endpoints:
    web:
      exposure:
        include: health,info
